# Keeps the pipeline current on its own.
#
# The workflows pin actions to a major (`@v7`), which already picks up patches
# and security fixes automatically. What a major pin cannot do is notice that
# `v8` exists — that is what this file is for. Same for the Docker base image
# and the npm tree.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    labels: [dependencies, docker]
    ignore:
      # Node stays on the newest LTS. 26 is current but not LTS, and production
      # images should not track current. Bump this when 26 goes LTS.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    labels: [dependencies]
    # Three majors this project holds back on purpose. Without these, Dependabot
    # reopens the same rejected PRs every week.
    ignore:
      # Peer constraint, not preference: @better-auth/redis-storage declares
      # `ioredis@^5`. Dependabot proposed v6 on the first run and CI rejected it
      # with ERESOLVE. Revisit when that package widens its peer range.
      - dependency-name: ioredis
        update-types: [version-update:semver-major]
      # TypeScript 7 is not yet supported by typescript-eslint.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # ESLint 10 breaks the eslint-plugin-react bundled in eslint-config-next.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
    groups:
      # One PR per ecosystem rather than thirty. Patch and minor bumps are
      # reviewed together; majors still arrive individually because they are the
      # ones that break things.
      minor-and-patch:
        update-types: [minor, patch]
