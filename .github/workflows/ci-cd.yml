# test → scan → build → scan-image → push → approval → deploy, one job each.
#
# Jobs run on separate runners, so the image is handed between them as an
# artifact: `build` exports a tarball, `scan-image` reads it with Trivy without
# needing a daemon, and `push` loads it. That costs an upload and two downloads
# per run — the price of the stages being genuinely separate rather than steps
# inside one job.
#
# Azure identifiers are placeholders. Fill these in under
# Settings → Secrets and variables → Actions before `push` can succeed:
#
#   Variables  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#              ACR_LOGIN_SERVER, ACR_REPOSITORY, AZURE_WEBAPP_NAME,
#              AZURE_RESOURCE_GROUP, NEXT_PUBLIC_APP_URL
#   Secrets    DATABASE_URL
#
# The approval gate is NOT in this file. It comes from a `production`
# environment with required reviewers, created under Settings → Environments.
# Without that, deploy runs straight through unreviewed.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches `FROM node:24-alpine` in the Dockerfile. 24 is the newest LTS.
  NODE_VERSION: "24"
  IMAGE_TAR: image.tar
  LOCAL_IMAGE: whalechat:${{ github.sha }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `postinstall` runs `prisma generate`. Not optional: `generated/` is
      # gitignored, so `@/generated/prisma/client` does not resolve until it has.
      - name: Install dependencies
        run: npm ci

      # Writes next-env.d.ts, gitignored but listed in tsconfig's `include`.
      - name: Generate route types
        run: npx next typegen

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  scan:
    name: Scan source
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          # Gitleaks scans history, not just the tree — a secret committed and
          # later removed is still leaked.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Reads package-lock.json against the registry; no install needed.
      #
      # `high` rather than `moderate` is considered, not lazy: the tree carries
      # one moderate advisory, in @better-auth/oauth-provider, which npm installs
      # as a non-optional peer of @better-auth-ui/react. That plugin is not
      # enabled in lib/auth.ts, so the affected code never runs.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # The MIT CLI, not gitleaks-action — the Action needs a paid licence for
      # organisation-owned repos, which this is.
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # NEXT_PUBLIC_APP_URL is inlined into the client bundle at build time, so
      # the image is tied to one origin and cannot be promoted between
      # environments. The fallback keeps the build working before that variable
      # is set; an image built that way is for scanning, not for shipping.
      - name: Build and export image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ env.IMAGE_TAR }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: ${{ runner.temp }}/${{ env.IMAGE_TAR }}
          retention-days: 1
          compression-level: 0 # already a compressed layer archive

  scan-image:
    name: Scan image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}

      # Scans the tarball directly — no docker load, no daemon.
      #
      # `ignore-unfixed` on purpose: an unpatched CVE in the node:24-alpine base
      # would otherwise block every deploy with nothing actionable to do.
      #
      # There is deliberately no .trivyignore. The findings this caught on its
      # first run were npm's own bundled copies of tar/undici/ip-address/
      # brace-expansion, and the Dockerfile deletes npm from the runtime image
      # rather than waiving them. A failure here means something real.
      - name: Trivy
        # Note the `v`. This action tags releases `v0.36.0`, not `0.36.0`.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ runner.temp }}/${{ env.IMAGE_TAR }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  push:
    name: Push to ACR
    runs-on: ubuntu-latest
    needs: scan-image
    # Nothing from an unmerged branch reaches the registry, and the job skips
    # itself entirely until Azure exists — so an unconfigured repo still gets a
    # green test → scan → build → scan-image pipeline.
    if: >-
      github.event_name != 'pull_request' &&
      vars.ACR_LOGIN_SERVER != ''
    permissions:
      contents: read
      id-token: write # OIDC federated credentials
    steps:
      # Catches the half-configured case: ACR_LOGIN_SERVER set, companions not.
      - name: Check Azure configuration
        run: |
          missing=""
          for var in ACR_REPOSITORY NEXT_PUBLIC_APP_URL \
                     AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!var}" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::ACR_LOGIN_SERVER is set but these are not:$missing"
            exit 1
          fi
        env:
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load --input "${{ runner.temp }}/${{ env.IMAGE_TAR }}"

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to ACR
        run: az acr login --name "${{ vars.ACR_LOGIN_SERVER }}"

      - name: Push
        run: |
          remote="${{ vars.ACR_LOGIN_SERVER }}/${{ vars.ACR_REPOSITORY }}"
          docker tag "${{ env.LOCAL_IMAGE }}" "$remote:${{ github.sha }}"
          docker tag "${{ env.LOCAL_IMAGE }}" "$remote:latest"
          docker push "$remote:${{ github.sha }}"
          docker push "$remote:latest"

  deploy:
    name: Deploy to App Service
    runs-on: ubuntu-latest
    needs: push
    # `environment` is what makes GitHub pause for a reviewer — but only once the
    # environment exists with required reviewers configured. See the header.
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_APP_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # For the Prisma CLI and the schema. The image deliberately does not
      # migrate on boot — two containers starting together would race.
      - name: Install dependencies
        run: npm ci

      # Before the new image serves traffic, so the schema is never behind the
      # code. Needs the runner to reach Postgres: a database behind a private
      # endpoint needs a firewall rule or a self-hosted runner.
      - name: Apply database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Runtime configuration lives in App Service, not the image:
      # BETTER_AUTH_SECRET, DATABASE_URL, REDIS_URL, DEEPSEEK_API_KEY,
      # RESEND_API_KEY, EMAIL_FROM. The commit SHA, not `latest`, so a deploy is
      # reproducible and a rollback is an older SHA.
      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.ACR_REPOSITORY }}:${{ github.sha }}
