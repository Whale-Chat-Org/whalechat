# Static analysis, kept in its own workflow so it can never block a deploy.
#
# The repository is public, so code scanning is free and this runs as-is. It
# would FAIL if the repo were ever made private without GitHub Code Security,
# which is the paid Team/Enterprise product — that is why it lives here rather
# than inside ci-cd.yml. A scanner the account is not entitled to must never
# stop the pipeline shipping.
#
# Nothing else to configure: `security-events: write` plus the default query
# suite is the whole setup.
name: CodeQL

# Deliberately NOT on `push` to main. Work reaches main through a pull request
# (see docs/git.md), which is scanned here before merge — scanning the identical
# tree again on the merge commit finds nothing new and puts a second entry in
# the Actions tab for every push. The weekly run is the backstop: it covers
# anything pushed straight to main, and picks up newly published queries against
# code that has not changed.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-and-quality adds maintainability queries on top of the
          # security ones. Drop to `security-extended` if the noise outweighs it.
          queries: security-and-quality

      # No build step: CodeQL analyses JavaScript and TypeScript straight from
      # source, so `next build` would only cost time.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
