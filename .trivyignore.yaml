# Vulnerabilities in dependencies Next.js vendors into `next/dist/compiled/`.
#
# These are not our dependencies and cannot be fixed by updating ours — they are
# copies Next bundles inside its own package, with the original package.json left
# in place for Trivy to find. Next 16.3.1 is the latest release, so there is
# nothing to upgrade to; they are fixed upstream or not at all.
#
# Each entry is scoped by `paths` to Next's vendored copy specifically. If the
# same CVE ever turns up in a package we actually depend on, the scan still
# fails — which is the point of not using a blanket CVE ignore.
#
# Remove entries as Next ships releases that vendor patched versions. The Alpine
# base layer itself scans clean; this file is entirely about the Node layer.
vulnerabilities:
  - id: CVE-2026-59873
    paths:
      - "app/node_modules/next/dist/compiled/tar/package.json"
    statement: >-
      node-tar gzip-bomb DoS, CRITICAL. Vendored by Next for its own build-time
      archive handling; not reachable from the standalone server we ship.

  - id: CVE-2026-59874
    paths:
      - "app/node_modules/next/dist/compiled/tar/package.json"
    statement: >-
      node-tar malformed-archive DoS. Same vendored copy as CVE-2026-59873.

  - id: CVE-2026-12151
    paths:
      - "app/node_modules/next/dist/compiled/undici/package.json"
    statement: >-
      undici unbounded-memory DoS. Vendored by Next; the app's own outbound
      calls go through Node's global fetch and the Resend SDK, not this copy.

  - id: CVE-2026-69192
    paths:
      - "app/node_modules/next/dist/compiled/ip-address/package.json"
    statement: >-
      ip-address inconsistent parsing. Vendored transitively by Next's compiled
      bundle; nothing in this app parses IPs through it.

  - id: CVE-2026-13149
    paths:
      - "app/node_modules/next/dist/compiled/brace-expansion/package.json"
    statement: >-
      brace-expansion DoS. Vendored by Next for glob handling at build time.

  - id: CVE-2026-14257
    paths:
      - "app/node_modules/next/dist/compiled/brace-expansion/package.json"
    statement: >-
      brace-expansion DoS. Same vendored copy as CVE-2026-13149.

  - id: CVE-2026-69152
    paths:
      - "app/node_modules/next/dist/compiled/brace-expansion/package.json"
    statement: >-
      brace-expansion unbounded intermediate arrays. Same vendored copy.
